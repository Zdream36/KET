    // document mints the blobs for its OWN frames, obtaining page text

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    const blobUrls = {};
    const resourceBlobs = {};

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    const resourceMap = {};

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12px/1.5 Nunito;color:#9A8F7C;margin-top:3px\">到点自动收尾，当前一组不会被打断<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:14px\">\n<sc-for list=\"{{ limits }}\" as=\"l\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ l.set }}\" style=\"flex:1;height:50px;border-radius:15px;cursor:pointer;font:700 14px/1 Nunito;background:{{ l.bg }};border:2px solid {{ l.bd }};color:{{ l.fg }}\">{{ l.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#FFFCF5;border:1px solid #EDE2CB;border-radius:22px;padding:6px 18px;box-shadow:0 2px 0 #F0E6D0\">\n<sc-for list=\"{{ toggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid {{ t.line }}\">\n<div style=\"flex:1;min-width:0\">\n<div style=\"font:700 14px/1.3 Nunito\">{{ t.title }}<\u002Fdiv>\n<div style=\"font:600 11.5px/1.5 Nunito;color:#9A8F7C;margin-top:3px\">{{ t.sub }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ t.toggle }}\" style=\"width:52px;height:31px;flex:none;border:none;border-radius:16px;cursor:pointer;padding:3px;display:flex;justify-content:{{ t.just }};background:{{ t.track }};transition:background .2s\">\n<div style=\"width:25px;height:25px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)\"><\u002Fdiv>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background:#FDF3E4;border:1px solid #F1E3C9;border-radius:20px;padding:15px 17px\">\n<div style=\"font:700 13.5px/1.3 Nunito\">护眼提醒<\u002Fdiv>\n<div style=\"font:600 12px/1.7 Nunito;color:#857B6A;margin-top:6px\">每 10 分钟弹一次「看看远处」小动画，孩子端不可跳过。设置由家长密码保护。<\u002Fdiv>\n<\u002Fdiv>\n\n<button type=\"button\" style=\"width:100%;height:52px;border:none;border-radius:18px;background:oklch(0.70 0.13 150);color:#fff;font:800 16px/1 Nunito;cursor:pointer;box-shadow:0 3px 0 oklch(0.58 0.13 150)\" style-active=\"transform:translateY(2px);box-shadow:0 1px 0 oklch(0.58 0.13 150)\">保存设置<\u002Fbutton>\n\n<div style=\"background:#FFFCF5;border:1px solid #EDE2CB;border-radius:20px;padding:15px 17px\">\n<div style=\"font:700 13.5px/1.3 Nunito\">学习数据<\u002Fdiv>\n<div style=\"font:600 12px/1.7 Nunito;color:#857B6A;margin-top:6px\">进度保存在这台设备的浏览器里，关掉网页也不会丢。换设备或换新版本前，先「导出进度」备份一份。<\u002Fdiv>\n<div style=\"margin-top:14px;padding:14px;border:1px solid #E2EAF0;border-radius:18px;background:#F2F7FA\">\n<div style=\"font:800 13.5px/1.3 Nunito;color:#40566B\">云同步<\u002Fdiv>\n\n<sc-if value=\"{{ noSync }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font:600 12px/1.7 Nunito;color:#6C8093;margin:6px 0 10px\">开启后进度自动存到云端，换手机、平板输入同步码就能接着背。<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ createSync }}\" style=\"height:40px;padding:0 16px;border:none;border-radius:14px;background:oklch(0.55 0.10 240);color:#fff;font:700 13px/1 Nunito;cursor:pointer\">开启云同步<\u002Fbutton>\n<input value=\"{{ codeInput }}\" sc-camel-on-change=\"{{ onCodeInput }}\" placeholder=\"已有同步码\" sc-camel-max-length=\"6\" style=\"width:120px;height:40px;box-sizing:border-box;padding:0 12px;border:1px solid #D6E2EA;border-radius:14px;background:#fff;font:700 14px/1 Arimo,'Helvetica Neue',Arial,sans-serif;letter-spacing:2px;color:#40566B;outline:none\">\n<button type=\"button\" sc-camel-on-click=\"{{ joinSync }}\" style=\"height:40px;padding:0 16px;border:1px solid #D6E2EA;border-radius:14px;background:#fff;color:#40566B;font:700 13px/1 Nunito;cursor:pointer\">接入<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasSync }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;align-items:center;gap:10px;margin:8px 0 10px;flex-wrap:wrap\">\n<div style=\"font:800 22px/1 Arimo,'Helvetica Neue',Arial,sans-serif;letter-spacing:4px;color:#40566B\">{{ syncCode }}<\u002Fdiv>\n<div style=\"font:600 11.5px/1.4 Nunito;color:#7B8FA0\">{{ syncMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:600 12px/1.7 Nunito;color:#6C8093;margin-bottom:10px\">在新设备的家长页输入这个码，即可同步全部进度。请抄下来保管好。<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ syncNow }}\" style=\"height:38px;padding:0 14px;border:none;border-radius:13px;background:oklch(0.55 0.10 240);color:#fff;font:700 12.5px/1 Nunito;cursor:pointer\">立即上传<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ pullNow }}\" style=\"height:38px;padding:0 14px;border:1px solid #D6E2EA;border-radius:13px;background:#fff;color:#40566B;font:700 12.5px/1 Nunito;cursor:pointer\">从云端取回<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ exportProgress }}\" style=\"height:40px;padding:0 16px;border:1px solid #DEEAD3;border-radius:14px;background:#F1F6EC;color:oklch(0.42 0.10 150);font:700 13px/1 Nunito;cursor:pointer\">导出进度<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ importProgress }}\" style=\"height:40px;padding:0 16px;border:1px solid #E9DEC6;border-radius:14px;background:#FDF3E4;color:#6B6252;font:700 13px/1 Nunito;cursor:pointer\">导入进度<\u002Fbutton>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ resetAll }}\" style=\"margin-top:12px;height:40px;padding:0 16px;border:1px solid #EFD9D0;border-radius:14px;background:#FBEDE8;color:oklch(0.48 0.12 25);font:700 13px/1 Nunito;cursor:pointer\">清空进度，从头开始<\u002Fbutton>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;us&quot;,&quot;uk&quot;],&quot;default&quot;:&quot;us&quot;,&quot;tsType&quot;:&quot;'us' | 'uk'&quot;,&quot;section&quot;:&quot;语音&quot;},&quot;rate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0.4,&quot;max&quot;:1.1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;语音&quot;},&quot;evalEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;跟读评测&quot;}}\">\nconst shuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);\n\n// 一组 6 题：题型按 看词选义 → 听音选词 → 看图选词 → 拼写 螺旋上升\nfunction buildQS(items, offset) {\n  const off = offset || 0;\n  const plan = [[0,'image'],[1,'audio'],[2,'choice'],[3,'image'],[2,'spell'],[0,'spell']];\n  return plan.map(([k, type0]) => {\n    const it = items[(k + off) % items.length];\n    const type = (type0 === 'spell' && !spellable(it.word)) ? 'choice' : type0;\n    const others = items.filter(o => o.word !== it.word);\n    const base = { type, word: it.word, phon: it.phon, meaning: it.meaning, img: it.img, note: it.note };\n    if (type === 'choice') {\n      const ds = (it.distractors && it.distractors.length ? it.distractors : others.map(o => o.meaning)).slice(0, 3);\n      return { ...base, options: shuffle([it.meaning, ...ds]), answer: it.meaning };\n    }\n    if (type === 'audio' || type === 'image') {\n      return { ...base, options: shuffle([it.word, ...shuffle(others).slice(0, 3).map(o => o.word)]), answer: it.word };\n    }\n    return base;\n  });\n}\n\n// 指定一批词的练习：每词一题，题型轮转\nconst spellable = (w) => /^[a-zA-Z]+$/.test(w || '');\nconst SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;\n// 五关顺序：看图 → 听音 → 认词 → 跟读 → 拼写\nconst TYPES = ['image','audio','choice','speak','spell'];\nconst REVIEW_GAPS = [1, 2, 4, 7, 15]; // 艾宾浩斯间隔（天）\n// 一个词的「过关」= 各关都答对（带空格的词免拼写关；浏览器不支持识别时免跟读关）\nconst checksFor = (it) => TYPES.filter(t =>\n  (t !== 'spell' || spellable(it.word)) && (t !== 'speak' || !!SR));\n\n// 归一化编辑距离，用于跟读打分\nfunction similar(a, b) {\n  a = (a || '').toLowerCase().replace(/[^a-z]/g, '');\n  b = (b || '').toLowerCase().replace(/[^a-z]/g, '');\n  if (!a || !b) return 0;\n  const d = [];\n  for (let i = 0; i <= a.length; i++) d[i] = [i];\n  for (let j = 0; j <= b.length; j++) d[0][j] = j;\n  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)\n    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));\n  return 1 - d[a.length][b.length] / Math.max(a.length, b.length);\n}\n\nfunction makeQ(it, type, pool) {\n  // 同义/同根词不能互为干扰项，否则会出现两个都对的选项\n  const bare = (w) => String(w || '').toLowerCase().replace(/[^a-z]/g, '');\n  const head = (m) => String(m || '').replace(/[（(].*$/, '').split(/[；;]/)[0].trim();\n  const kin = (a, b) => {\n    const x = bare(a.word), y = bare(b.word);\n    if (x && y && (x.startsWith(y) || y.startsWith(x))) return true;   // swim/swimming, sail/sailing\n    return head(a.meaning) === head(b.meaning);                        // 游泳/游泳, 足球/足球\n  };\n  const strict = pool.filter(o => o.word !== it.word && !kin(o, it));\n  const others = strict.length >= 3 ? strict : pool.filter(o => o.word !== it.word);\n  const base = { type, word: it.word, phon: it.phon, meaning: it.meaning, img: it.img, note: it.note };\n  if (type === 'choice') {\n    const ds = (it.distractors && it.distractors.length ? it.distractors : shuffle(others).map(o => o.meaning)).slice(0, 3);\n    return { ...base, options: shuffle([it.meaning, ...ds]), answer: it.meaning };\n  }\n  if (type === 'audio' || type === 'image') {\n    return { ...base, options: shuffle([it.word, ...shuffle(others).slice(0, 3).map(o => o.word)]), answer: it.word };\n  }\n  return base;\n}\n\nfunction buildSet(list, pool) {\n  return list.map((it, k) => {\n    let type = TYPES[k % TYPES.length];\n    if (type === 'spell' && !spellable(it.word)) type = 'choice';\n    if (type === 'speak' && !SR) type = 'audio';\n    return makeQ(it, type, pool);\n  });\n}\n\nconst FALLBACK = [\n  { word:'apple', phon:'/ˈæpl/', meaning:'苹果', distractors:['香蕉','橘子','葡萄'] },\n  { word:'banana', phon:'/bəˈnɑːnə/', meaning:'香蕉', distractors:['生日','自行车','兄弟'] },\n  { word:'tiger', phon:'/ˈtaɪɡə/', meaning:'老虎', distractors:['狮子','斑马','猴子'] },\n  { word:'library', phon:'/ˈlaɪbrəri/', meaning:'图书馆', distractors:['医院','邮局','超市'] },\n];\nlet QS = buildQS(FALLBACK);\n\nconst CORAL = 'oklch(0.70 0.13 40)', CORAL_D = 'oklch(0.60 0.13 40)';\nconst GREEN = 'oklch(0.70 0.13 150)', GREEN_D = 'oklch(0.58 0.13 150)';\nconst WARN = 'oklch(0.64 0.14 25)';\n\nclass Component extends DCLogic {\n  state = { screen:'home', i:0, answers:{}, shake:0, unit:'Day 2 · 房子内外', newCount:13,\n    mastery:{}, dayIdx:0, pTab:'report', rTab:'due', limit:20, bedtime:true, breaks:true, weekly:false,\n    checkins:[], syncCode:'', codeInput:'', syncState:'idle', syncAt:0,\n    lPlay:false, lIdx:0, lRep:0, lRate:0.8, lScope:'day',\n    gMode:'', gi:0, gScore:0, gBest:0, gPicked:'', gDone:false,\n    phWord:'', phI:-1, speakTry:0 };\n\n  // 认词题、听音题一出现就自动念一遍（孩子先听到音，再选意思）\n  autoPlay = (idx) => {\n    const q = QS[idx];\n    if (!q || (q.type !== 'choice' && q.type !== 'audio' && q.type !== 'spell' && q.type !== 'speak')) return;\n    setTimeout(() => { this.runPhonics(q.word); this.utter(q.word, this.props.rate ?? 0.8); }, 300);\n  };\n\n  mkey = (word, type) => this.state.dayIdx + '|' + word + '|' + type;\n\n  // 今天还没过关的关卡，按 看图→听音→认词→跟读→拼写 排队\n  pending = () => {\n    const m = this.state.mastery || {};\n    const out = [];\n    TYPES.forEach(t => (this.items || FALLBACK).forEach(it => {\n      if (t === 'spell' && !spellable(it.word)) return;\n      if (!m[this.mkey(it.word, t)]) out.push({ it, t });\n    }));\n    return out;\n  };\n\n  pendingWords = () => {\n    const m = this.state.mastery || {};\n    return (this.items || FALLBACK).filter(it => checksFor(it).some(t => !m[this.mkey(it.word, t)]));\n  };\n\n  record = (word, type, ok) => {\n    const m = { ...(this.state.mastery || {}) };\n    m[this.mkey(word, type)] = !!ok;\n    const wkey = this.state.dayIdx + '|' + word;\n    if (!ok) {\n      const wrongs = { ...(this.state.wrongs || {}) };\n      wrongs[wkey] = { n: ((wrongs[wkey] || {}).n || 0) + 1, type };\n      const lv = { ...(this.state.reviewLv || {}) }; lv[wkey] = 0;\n      this.setState({ wrongs, reviewLv: lv });\n    } else if (this.state.session) { // 复习答对 → 间隔升一级\n      const lv = { ...(this.state.reviewLv || {}) };\n      lv[wkey] = Math.min(REVIEW_GAPS.length - 1, (lv[wkey] || 0) + 1);\n      this.setState({ reviewLv: lv });\n    }\n    return m;\n  };\n\n  pickDay = (idx) => {\n    const day = this.days[idx];\n    if (!day) return;\n    this.items = day.items;\n    QS = buildQS(day.items, 0);\n    const t = (day.title || '').split('·').pop().trim();\n    this.setState({ dayIdx: idx, unitName: day.unit || '', unit: day.id + (t ? ' · ' + t : ''), newCount: day.items.length,\n      screen: 'home', answers: {}, i: 0 });\n  };\n\n  toReview = () => this.setState({ screen:'review', rTab:'due' });\n\n  // 复习中心的两个入口：只练指定的那批词\n  startSet = (words, label) => () => {\n    const pool = this.items || FALLBACK;\n    const list = words.map(w => pool.find(o => o.word === w.word) || w);\n    QS = buildSet(list, pool);\n    this.setState({ screen:'learn', i:0, answers:{}, shake:0, session: label });\n    this.autoPlay(0);\n  };\n\n  rDue = () => this.setState({ rTab:'due' });\n  rWrong = () => this.setState({ rTab:'wrong' });\n  say = (w) => () => this.utter(w, this.props.rate ?? 0.8);\n\n  toReport = () => this.setState({ pTab:'report' });\n  toSettings = () => this.setState({ pTab:'settings' });\n  setLimit = (v) => this.setState({ limit: v });\n  flip = (k) => this.setState({ [k]: !this.state[k] });\n\n  setAns = (patch, extra) => {\n    const a = { ...this.state.answers, [this.state.i]: { ...(this.state.answers[this.state.i] || {}), ...patch } };\n    this.setState({ answers: a, ...(extra || {}) });\n  };\n\n  okImg = {};\n\n  // ── 网页版：学习进度存 localStorage，刷新/关掉浏览器都不丢 ──\n  SAVE_KEY = 'bdc.web.v1';\n\n  loadSaved = () => {\n    try {\n      const raw = localStorage.getItem(this.SAVE_KEY);\n      if (!raw) return null;\n      const d = JSON.parse(raw);\n      return d && typeof d === 'object' ? d : null;\n    } catch (e) { return null; }\n  };\n\n  snapshot = () => {\n    const s = this.state;\n    return { mastery: s.mastery, reviewLv: s.reviewLv, wrongs: s.wrongs, dayIdx: s.dayIdx,\n      limit: s.limit, bedtime: s.bedtime, breaks: s.breaks, weekly: s.weekly, checkins: s.checkins,\n      savedAt: Date.now() };\n  };\n\n  applySnap = (d) => {\n    if (!d) return;\n    this.setState({ mastery: d.mastery || {}, reviewLv: d.reviewLv || {}, wrongs: d.wrongs || {},\n      limit: d.limit ?? 20, bedtime: d.bedtime ?? true, breaks: d.breaks ?? true, weekly: d.weekly ?? false,\n      checkins: d.checkins || [] });\n    if (typeof d.dayIdx === 'number' && this.days && this.days[d.dayIdx]) this.pickDay(d.dayIdx);\n  };\n\n  persist = () => {\n    const snap = this.snapshot();\n    const str = JSON.stringify({ ...snap, savedAt: 0 });\n    if (str === this.lastSaved) return;\n    this.lastSaved = str;\n    this.localSavedAt = snap.savedAt;\n    try { localStorage.setItem(this.SAVE_KEY, JSON.stringify(snap)); } catch (e) {}\n    this.cloudQueue();\n  };\n\n  // —— 云同步（Supabase）——\n  SUPA_URL = 'https://pyfygjigcpwckeyfdkzh.supabase.co';\n  SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5ZnlnamlnY3B3Y2tleWZka3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzAxOTcsImV4cCI6MjEwMTI0NjE5N30.OO1Kh_sIsqlUnKepAnNRz1F1imHyE1RMw-g1j4ab3eA';\n  CODE_KEY = 'bdc-sync-code';\n\n  supaHeaders = () => ({ apikey: this.SUPA_KEY, Authorization: 'Bearer ' + this.SUPA_KEY,\n    'Content-Type': 'application/json' });\n\n  // 答题过程中频繁保存，云端 6 秒合并上传一次\n  cloudQueue = () => {\n    if (!this.state.syncCode) return;\n    clearTimeout(this.pushTimer);\n    this.pushTimer = setTimeout(this.cloudPush, 6000);\n  };\n\n  cloudPush = () => {\n    const code = this.state.syncCode;\n    if (!code) return Promise.resolve(); s.saved = this.loadSaved();\n    if (this.saved) {\n      this.setState({\n        mastery: this.saved.mastery || {}, reviewLv: this.saved.reviewLv || {}, wrongs: this.saved.wrongs || {},\n        limit: this.saved.limit ?? 20, bedtime: this.saved.bedtime ?? true,\n        breaks: this.saved.breaks ?? true, weekly: this.saved.weekly ?? false,\n        checkins: this.saved.checkins || [],\n      });\n    }\n    let code = null;\n    try { code = localStorage.getItem(this.CODE_KEY); } catch (e) {}\n    if (code) {\n      this.setState({ syncCode: code });\n      // 开机拉一次：云端比本地新才覆盖，避免把别的设备的进度冲掉\n      this.cloudPull(code).then(d => {\n        const local = (this.saved && this.saved.savedAt) || 0;\n        if (d && (d.savedAt || 0) > local) this.applySnap(d);\n        else if (!d) this.cloudPush();\n      });\n    }\n    this.saveTimer = setInterval(this.persist, 1200);\n    window.addEventListener('beforeunload', this.persist);\n    this.loadVoices();\n    // 直接打开本地文件时 fetch 会被浏览器拦掉，所以优先用内嵌的 words-data.js\n    const source = window.BDC_WORDS\n      ? Promise.resolve(window.BDC_WORDS)\n      : fetch('./words.json').then(r => r.json());\n    source.then(d => {\n      if (!d) return;\n      // 支持两种格式：{items:[…]} 或按天分组 {days:[{id,title,items}]}\n      this.days = Array.isArray(d.days) && d.days.length\n        ? d.days\n        : (Array.isArray(d.items) && d.items.length ? [{ id: d.unit || '今日', title: d.unit || '', items: d.items }] : null);\n      if (!this.days) return;\n      const saved = this.saved && typeof this.saved.dayIdx === 'number' ? this.saved.dayIdx : -1;\n      const idx = saved >= 0 && saved < this.days.length ? saved : Math.max(0, this.days.findIndex(x => x.id === d.today));\n      this.pickDay(idx);\n      const all = this.days.reduce((a, x) => a.concat(x.items), []);\n      all.forEach(it => {\n        if (!it.img) return;\n        const im = new Image();\n        im.onload = () => { this.okImg[it.img] = 1; this.forceUpdate(); };\n        im.src = 'imag   speechSynthesis.cancel();\n      setTimeout(() => speechSynthesis.speak(u), 60);\n      // 兜底：个别浏览器不触发 onend\n      clearTimeout(this.lGuard);\n      this.lGuard = setTimeout(() => { if (u.onend) { u.onend = null; onEnd(); } }, 6000);\n    } catch (e) { setTimeout(onEnd, 800); }\n  };\n\n  listenList = () => {\n    if (!this.days) return [];\n    if (this.state.lScope === 'all') return this.days.reduce((a, d) => a.concat(d.items || []), []);\n    const d = this.days[this.state.dayIdx];\n    return d ? d.items : [];\n  };\n\n  playStep = () => {\n    if (!this.state.lPlay) return;\n    const list = this.listenList();\n    const it = list[this.state.lIdx];\n    if (!it) return this.setState({ lPlay: false });\n    this.runPhonics(it.word);\n    this.utterOnce(it.word, this.state.lRate, () => {\n      clearTimeout(this.lGuard);\n      if (!this.state.lPlay) return;\n      const rep = this.state.lRep + 1;\n      if (rep < this.REPS) {\n        this.setState({ lRep: rep });\n        this.lTimer = setTimeout(this.playStep, 2000); // 每遍之间停 2 秒，留出跟读时间\n      } else {\n        const nx = (this.state.lIdx + 1) % list.length;\n        this.setState({ lIdx: nx, lRep: 0 });\n        this.lTimer = setTimeout(this.playStep, 2400); // 换词多停一拍\n      }\n    });\n  };\n\n  stopPlay = () => {\n    clearTimeout(this.lTimer); clearTimeout(this.lGuard);\n    try { speechSynthesis.cancel(); } catch (e) {}\n    this.setState({ lPlay: false });\n  };\n\n  // —— 自然拼读：把单词切成字母组合，跟着发音依次点亮 ——\n  DIGRAPHS = ['tch','igh','dge','ch','sh','th','ph','wh','ck','ng','qu','ai','ay','ea','ee','ie','oa','oo','ou','ow','oi','oy','ue','ui','au','aw','ew','ar','er','ir','or','ur','all','ll','ss','ff','zz'];\n\n  chunkWord = (word) => {\n    const w = String(word || '');\n    const out = [];\n    let i = 0;\n    while (i < w.length) {\n      const rest = w.slice(i).toLowerCase();\n      if (/^[^a-z]/.test(rest)) { out.push(w[i]); i += 1; continue; } // 空格、连字符原样\n      const hit = this.DIGRAPHS.find(d => rest rd:'chimney', meaning:'烟囱', miss:2 },\n      ],\n\n      speak: this.speak, speakSlow: this.speakSlow, next: this.next, back: this.back, prev: this.prev, skip: this.skip,\n      start: this.start, home: this.home,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
